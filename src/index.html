<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="PDF, PPTX, 이미지를 빔 프로젝터 환경으로 미리 확인하세요."><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' blob:; style-src 'unsafe-inline'; img-src data: blob:; font-src data: blob:; worker-src blob:; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>BeamProjector Ruined MYPPT</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232c65ed'/%3E%3Cpath d='M7 9h18v12H7zM16 21v5m-5 0h10' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E"><style>/* STYLE */</style></head>
<body>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('beam-theme')==='dark'?'dark':'light';const bg=localStorage.getItem('beam-background');if(/^#[0-9a-f]{6}$/i.test(bg||''))document.documentElement.style.setProperty('--preview-background',bg);}catch{}</script>
<header><div class="brand"><span class="brand-icon" aria-hidden="true">▱</span> <span class="brand-name">BeamProjector Ruined MYPPT</span></div><div class="header-actions"><button id="themeToggle" class="icon-button" aria-label="다크모드" aria-pressed="false" title="다크모드"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13a9 9 0 0 1-9.9-9.9A9 9 0 1 0 20.9 13Z"/></svg></button><button id="open" class="primary">＋ 파일 열기</button></div><input id="file" type="file" accept=".pdf,.pptx,.png,.jpg,.jpeg,.webp,.bmp" hidden></header>
<main><section class="workspace"><div class="toolbar"><div class="segmented" aria-label="미리보기 모드"><button id="original" aria-pressed="false">원본</button><button id="projected" aria-pressed="true">프로젝터</button></div><span id="filename">색감 테스트 · 샘플</span><button id="panelToggle" aria-expanded="true" aria-controls="panel" aria-label="조절 패널 접기" title="조절 패널 접기"><svg class="panel-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 6 6 6-6 6m8-12 6 6-6 6"/></svg><span>조절 패널</span></button></div>
<div id="previewShell"><div id="viewport" tabindex="0" aria-label="미리보기. 좌우 방향키로 페이지 이동"><div id="stageWrap"><div id="stage"><div id="surface"></div><div id="rasterSurface" hidden aria-hidden="true"></div><div id="bloom" aria-hidden="true"></div><div id="ambient"></div><div id="vignette"></div></div></div><div id="dropOverlay">파일을 놓아 열기</div></div><button id="fullscreen" class="icon-button" aria-label="전체화면" aria-pressed="false" title="전체화면 · Esc로 나가기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div>
<div class="bottom"><div class="pagination"><button id="prev" aria-label="이전 페이지">‹</button><label><input id="page" type="number" min="1" value="1" aria-label="페이지 번호"> <span id="pageCount">/ 1</span></label><button id="next" aria-label="다음 페이지">›</button></div><div class="zoom"><button id="minus" aria-label="5% 축소">−</button><span id="zoomValue">100%</span><button id="plus" aria-label="5% 확대">＋</button><span class="divider"></span><button id="fit">화면에 맞추기</button></div></div>
<div id="message" role="status" aria-live="polite">파일을 끌어 놓거나 ‘파일 열기’를 선택하세요.</div></section>
<aside id="panel"><div class="panel-heading"><h1>프로젝터 환경</h1><button id="reset" title="모든 조절값을 0으로 초기화">초기화</button></div><label class="field-label" for="preset">프리셋</label><select id="preset"><option value="classroom">일반 강의실</option><option value="bright">밝은 강의실</option><option value="old">오래된 프로젝터</option><option value="dark">어두운 강의실</option><option value="custom">사용자 설정</option></select><section class="resolution-control"><label class="field-label" for="resolution">프로젝터 해상도</label><select id="resolution"><option value="native">원본 해상도</option><option value="1920x1080">Full HD · 1920 × 1080</option><option value="1280x800">WXGA · 1280 × 800</option><option value="1280x720">HD · 1280 × 720</option><option value="1024x768">XGA · 1024 × 768</option><option value="800x600">SVGA · 800 × 600</option><option value="640x480">VGA · 640 × 480</option><option value="custom">사용자 지정</option></select><div id="resolutionDimensions" hidden><input id="resolutionWidth" type="number" min="160" max="3840" step="1" value="1024" aria-label="프로젝터 가로 해상도"><span>×</span><input id="resolutionHeight" type="number" min="90" max="2160" step="1" value="768" aria-label="프로젝터 세로 해상도"><span>px</span></div><p id="resolutionInfo" role="status">원본 선명도</p></section><div id="controls"></div><div class="panel-foot"><span class="small-label">SIMULATION</span><p>실제 기기·조명·스크린에 따라 차이가 있습니다.</p><button id="sample">테스트 이미지 열기</button></div></aside></main>
<script>/* SCRIPT */</script></body></html>
